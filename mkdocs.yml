site_name: Kanban AI Documentation
site_description: Desktop app per la gestione di ticket in locale con AI agent integrato
site_author: Kanban AI Team
site_url: https://kanban-ai.dev

repo_name: kanban-ai
repo_url: https://github.com/kanban-ai/kanban

theme:
  name: material
  language: it
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: it
  - mermaid2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
  - Architecture:
    - Overview: architecture/overview.md
    - Frontend (React/Tauri): architecture/frontend.md
    - Backend (Rust): architecture/backend.md
    - AI Agent (Python/DSPy): architecture/agent.md
    - Data Flow: architecture/data-flow.md
  - DSPy Guide:
    - Introduction: dspy-guide/introduction.md
    - Core Concepts: dspy-guide/concepts.md
    - Project Modules: dspy-guide/modules.md
    - Assertions & Validation: dspy-guide/assertions.md
    - Optimization: dspy-guide/optimization.md
    - Examples: dspy-guide/examples.md
  - API Reference:
    - REST API: api-reference/rest-api.md
    - Tauri Commands: api-reference/tauri-commands.md
    - Types: api-reference/types.md
  - User Guide:
    - Board Management: user-guide/board-management.md
    - AI Features: user-guide/ai-features.md
    - Keyboard Shortcuts: user-guide/keyboard-shortcuts.md
    - Tips & Tricks: user-guide/tips-tricks.md
  - Development:
    - Contributing: development/contributing.md
    - Testing: development/testing.md
    - Ralph Automation: development/ralph.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kanban-ai/kanban
  generator: false
